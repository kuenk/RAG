[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fire>=0.7.1",
    "numpy>=2.2.6",
    "pydantic>=2.14.2",
    "scipy>=1.15.3",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
exclude = ["^data/", "^\\.venv/"]